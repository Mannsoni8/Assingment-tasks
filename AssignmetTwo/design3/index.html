<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
        <div class="left">

            <h1>INSECT</h1>

            <div class="search">
                <input type="text" placeholder="Search...">
            </div>

            <div class="classification">
                <h2>Classification</h2>

                <div class="info">
                    <p><span>Class:</span> Insecta</p>
                    <p><span>Order:</span> Coleoptera</p>
                    <p><span>Family:</span> Cerambycidae</p>
                    <p><span>Sub-Family:</span> Cerambycinae</p>
                    <p><span>Tribe:</span> Callichromatini</p>
                    <p><span>Genus:</span> Pachyteria</p>
                </div>
            </div>

        </div>

        <div class="right">

            <nav>
                <a href="#">Home</a>
                <a href="#">Shop</a>
                <a href="#">About</a>
                <a href="#">Gallery</a>
                <a href="#">Contact</a>
            </nav>

            <div class="details">

                <h1>Pachyteria<br>equestris</h1>

                <div class="specs">
                    <p>Malaysia</p>
                    <p>Male</p>
                    <p>32 mm / 12 mm</p>
                </div>

                <h2>$5.99</h2>

                <div class="toggle">
                    <label>
                        <input type="checkbox">
                        View detailed antennae
                    </label>
                </div>

                <div class="toggle">
                    <label>
                        <input type="checkbox">
                        View underside
                    </label>
                </div>

                <button>Add to Collection</button>

            </div>

        </div>

        <div class="insect-image">
            <img src="./images/image.png" alt="Insect">
        </div>

    </div>

</body>
</html>

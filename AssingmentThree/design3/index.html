<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squid Game</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Navbar -->

      <nav class="navbar">
        <div class="logo">
          <img src="./images/logo.png" alt="" />
        </div>

        <div class="nav-links">
          <a href="#">About</a>
          <a href="#">Watch Now</a>
          <a href="#">Actors</a>
          <a href="#">Contact</a>
        </div>

        <div class="menu">
          <i class="ri-menu-line"></i>
        </div>
      </nav>

      <div class="hero">
        <div class="left">
          <img src="./images/logo.png" class="title-logo" alt="" />

          <p>Action / Thriller / Drama Series directed by Dong-hyuk Hwang</p>

          <p>Season 1: 9 Episodes</p>

          <div class="buttons">
            <button class="play-btn">▶ Play Now</button>

            <button class="trailer-btn">Watch Trailer</button>
          </div>
        </div>

        <div class="right">
          <img src="./images/desc.png" alt="" class="guard" />
        </div>
      </div>

      <div class="cards">
        <div class="card">
          <img src="./images/card1.png" alt="" />
        </div>

        <div class="card">
          <img src="./images/card2.png" alt="" />
        </div>

        <div class="card">
          <img src="./images/card3.png" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
